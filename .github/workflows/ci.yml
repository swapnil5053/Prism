name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism-test
          POSTGRES_DB: prism_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prism" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra eval
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: No SQL built from f-strings
        run: "! grep -rnE 'text\\(f[\"'\\'']' src/"
      - run: uv run pytest -m "not model" --cov --cov-report=term-missing --cov-fail-under=85

  model:
    # Real QwenDetector code on a tiny random checkpoint (CPU), plus mypy with torch installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra worker --extra eval
      - run: uv run --extra worker --extra eval mypy
      - run: uv run --extra worker pytest -m model

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The worker image is several GB of CUDA libraries; it's built locally, not in CI.
      - run: docker build -f deploy/api.Dockerfile -t prism-api .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Python dependencies
        run: uv export --frozen --all-extras --no-hashes --no-emit-project > req.txt && uvx pip-audit -r req.txt --disable-pip --no-deps
      - name: JS dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
