[project]
name = "prism"
version = "0.1.0"
description = "Screenshot accessibility auditor: VLM element detection plus pixel-level WCAG checks."
readme = "README.md"
authors = [{ name = "Swapnil Shantha Kumar" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
worker = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
]
eval = [
    "playwright>=1.45",
]

[project.scripts]
prism-api = "prism.api.__main__:main"
prism-worker = "prism.worker.__main__:main"
prism-eval = "prism.evaluation.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx-ws>=0.7",
]

[tool.uv]
# rapidocr asks for the desktop OpenCV build, which needs libGL at import time.
# The headless build provides the same cv2 module without it.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/prism/db/migrations/**" = ["E501"]
"src/prism/evaluation/**" = ["S311"]  # seeded randomness for data generation

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/prism"]

[[tool.mypy.overrides]]
module = ["arq.*", "transformers.*", "torch.*", "bitsandbytes.*"]
ignore_missing_imports = true

# transformers ships without complete type hints.
[[tool.mypy.overrides]]
module = ["prism.vision.qwen"]
disallow_untyped_calls = false

[tool.alembic]
script_location = "%(here)s/src/prism/db/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Postgres and Redis (see tests/conftest.py)",
    "model: runs the detector on a tiny random model; needs the worker extra",
]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["src/prism"]
branch = true
# SQLAlchemy's asyncio layer runs on greenlets; without this, lines after awaits look unrun.
concurrency = ["greenlet", "thread"]
# Entry points, and the model and OCR backends (covered by the separate `model` CI job).
omit = [
    "*/__main__.py",
    "src/prism/vision/qwen.py",
    "src/prism/vision/ocr.py",
    "src/prism/evaluation/gpu.py",
    "src/prism/worker/settings.py",
]
