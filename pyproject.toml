[project]
name = "prism"
version = "0.1.0"
description = "Screenshot accessibility auditor: VLM element detection plus pixel-level WCAG checks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Swapnil Shantha Kumar" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
worker = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
]

[project.scripts]
prism-api = "prism.api.__main__:main"
prism-worker = "prism.worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx-ws>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/prism"]

[[tool.mypy.overrides]]
module = ["arq.*", "transformers.*", "torch.*", "bitsandbytes.*"]
ignore_missing_imports = true

# transformers ships without complete type hints.
[[tool.mypy.overrides]]
module = ["prism.vision.qwen"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Postgres and Redis (see tests/conftest.py)",
    "model: runs the detector on a tiny random model; needs the worker extra",
]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["src/prism"]
branch = true
# SQLAlchemy's asyncio layer runs on greenlets; without this, lines after awaits look unrun.
concurrency = ["greenlet", "thread"]
