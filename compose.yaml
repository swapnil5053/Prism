# CPU services: database, queue, API + web. Add the GPU worker with:
#   docker compose -f compose.yaml -f compose.gpu.yaml up
name: prism

x-env: &env
  PRISM_DATABASE_URL: postgresql+asyncpg://prism:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/prism
  PRISM_REDIS_URL: redis://redis:6379/0
  PRISM_SECRET_KEY: ${PRISM_SECRET_KEY:?set it in .env}
  PRISM_COOKIE_SECURE: ${PRISM_COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prism
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: prism-api
    command: ["alembic", "upgrade", "head"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: prism-api
    environment: *env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
